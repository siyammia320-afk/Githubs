<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arafat FB Creator - Admin Control Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header -->
        <div class="glass-card rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl border-l-4 border-sky-500">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-white flex items-center gap-3">
                    <i class="fa-brands fa-facebook text-sky-400"></i> ARAFAT FB CREATOR
                </h1>
                <p class="text-sm text-slate-400 mt-1">
                    Master Admin Control Panel — Global App ON/OFF Switch
                </p>
            </div>
            <button onclick="loadAppConfig()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition active:scale-95 shadow-lg shadow-sky-600/30">
                <i class="fa-solid fa-rotate"></i> Refresh Status
            </button>
        </div>

        <!-- Global App ON/OFF Control Card -->
        <div class="glass-card rounded-2xl p-6 md:p-8 shadow-2xl space-y-6 border border-slate-700/60">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700/60 pb-6">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-power-off text-amber-400"></i> App Master Switch (অ্যাপস অন/অফ সুইচ)
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">
                        HTML এর ভিতর এপস অফ রাখলে কারো ফোনে অ্যাপস চলবে না। অন রাখলে সবাই চালাতে পারবে।
                    </p>
                </div>

                <!-- Current Status Badge -->
                <div id="statusBadge" class="px-4 py-2 rounded-full font-black text-sm flex items-center gap-2 bg-slate-800 text-slate-400 border border-slate-700">
                    <i class="fa-solid fa-spinner fa-spin"></i> Checking...
                </div>
            </div>

            <!-- Big Action Buttons -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- TURN ON BUTTON -->
                <button onclick="setAppStatus('on')" class="group relative overflow-hidden bg-emerald-600 hover:bg-emerald-500 text-white p-6 rounded-2xl font-black text-lg transition duration-200 shadow-xl shadow-emerald-900/30 flex flex-col items-center justify-center gap-2 border border-emerald-400/30 active:scale-98">
                    <div class="w-14 h-14 rounded-full bg-emerald-500/40 flex items-center justify-center text-2xl text-emerald-200 group-hover:scale-110 transition">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <span>TURN APP ON (অ্যাপ চালু করুন 🟢)</span>
                    <span class="text-xs font-normal text-emerald-200">সব ইউজার স্বাভাবিকভাবে অ্যাপ চালাতে পারবে</span>
                </button>

                <!-- TURN OFF BUTTON -->
                <button onclick="setAppStatus('off')" class="group relative overflow-hidden bg-rose-600 hover:bg-rose-500 text-white p-6 rounded-2xl font-black text-lg transition duration-200 shadow-xl shadow-rose-900/30 flex flex-col items-center justify-center gap-2 border border-rose-400/30 active:scale-98">
                    <div class="w-14 h-14 rounded-full bg-rose-500/40 flex items-center justify-center text-2xl text-rose-200 group-hover:scale-110 transition">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </div>
                    <span>TURN APP OFF (অ্যাপ বন্ধ রাখুন 🔴)</span>
                    <span class="text-xs font-normal text-rose-200">কারো ফোনে অ্যাপ চলবে না, অফ দেখাবে</span>
                </button>

            </div>

            <!-- Custom Notice Message Form -->
            <div class="pt-4 border-t border-slate-700/60 space-y-3">
                <label class="block text-sm font-bold text-slate-300">
                    <i class="fa-solid fa-bullhorn text-sky-400"></i> Maintenance Notice Message (ইউজারদের মেসেজ)
                </label>
                <textarea id="noticeMessage" rows="3" placeholder="e.g. অ্যাপস বর্তমানে আপডেটের কাজের জন্য বন্ধ রয়েছে। কিছুক্ষন পর চেষ্টা করুন।" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500 resize-none"></textarea>
                <button onclick="saveNoticeOnly()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-lg active:scale-95">
                    <i class="fa-solid fa-floppy-disk"></i> Save Notice Message Only
                </button>
            </div>

        </div>

    </div>

    <script>
        const CONFIG_URL = "https://admin-pnal-ed74f-default-rtdb.firebaseio.com/app_config.json";

        async function loadAppConfig() {
            const badge = document.getElementById('statusBadge');
            badge.className = "px-4 py-2 rounded-full font-black text-sm flex items-center gap-2 bg-slate-800 text-slate-400 border border-slate-700";
            badge.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking...`;

            try {
                const res = await fetch(CONFIG_URL);
                const data = await res.json();

                const status = (data && data.status) ? data.status : 'on';
                const notice = (data && data.notice) ? data.notice : 'অ্যাপ বর্তমানে এডমিন দ্বারা বন্ধ রাখা হয়েছে।';

                document.getElementById('noticeMessage').value = notice;

                if (status === 'off' || status === 'disabled') {
                    badge.className = "px-4 py-2 rounded-full font-black text-sm flex items-center gap-2 bg-rose-500/20 text-rose-400 border border-rose-500/40";
                    badge.innerHTML = `<i class="fa-solid fa-circle text-rose-500 animate-pulse"></i> APP IS OFF (বন্ধ 🔴)`;
                } else {
                    badge.className = "px-4 py-2 rounded-full font-black text-sm flex items-center gap-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
                    badge.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 animate-pulse"></i> APP IS ON (চালু 🟢)`;
                }
            } catch (e) {
                badge.className = "px-4 py-2 rounded-full font-black text-sm flex items-center gap-2 bg-amber-500/20 text-amber-400 border border-amber-500/40";
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Network Error`;
            }
        }

        async function setAppStatus(newStatus) {
            const notice = document.getElementById('noticeMessage').value.trim() || 'অ্যাপ বর্তমানে এডমিন দ্বারা বন্ধ রাখা হয়েছে।';

            const payload = {
                status: newStatus,
                isAppOn: newStatus === 'on',
                notice: notice,
                updatedAt: new Date().toISOString()
            };

            try {
                const res = await fetch(CONFIG_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert(`Success! App is now turned ${newStatus.toUpperCase()} (${newStatus === 'on' ? 'চালু 🟢' : 'বন্ধ 🔴'}).`);
                    loadAppConfig();
                } else {
                    alert("Failed to update status on Firebase.");
                }
            } catch (e) {
                alert("Error updating status: " + e.message);
            }
        }

        async function saveNoticeOnly() {
            const notice = document.getElementById('noticeMessage').value.trim();
            if (!notice) {
                alert("Please write a notice message.");
                return;
            }

            try {
                const res = await fetch("https://admin-pnal-ed74f-default-rtdb.firebaseio.com/app_config/notice.json", {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(notice)
                });

                if (res.ok) {
                    alert("Notice message saved successfully!");
                    loadAppConfig();
                }
            } catch (e) {
                alert("Error saving notice: " + e.message);
            }
        }

        // Initial Load
        loadAppConfig();
    </script>
</body>
</html>
